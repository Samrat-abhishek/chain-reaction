<h1>Chain Reaction</h1>

<script>

const rows = 6;
const cols = 6;
let currentPlayer = 1;
let totalMoves = 0;
const board = [];
const grid = document.getElementById("grid");
const turnText = document.getElementById("turn");

for(let r=0;r<rows;r++){

    board[r]=[];

    for(let c=0;c<cols;c++){

        board[r][c]={
            count:0,
            owner:0
        };

        const cell=document.createElement("div");

        cell.className="cell";
        cell.dataset.row=r;
        cell.dataset.col=c;

        cell.addEventListener("click",handleMove);

        grid.appendChild(cell);
    }
}

function handleMove(){

    const row=parseInt(this.dataset.row);
    const col=parseInt(this.dataset.col);

    const cellData=board[row][col];

    if(
        cellData.owner!==0 &&
        cellData.owner!==currentPlayer
    ){
        return;
    }

    addOrb(row,col,currentPlayer);
    totalMoves++;

    currentPlayer =
        currentPlayer===1 ? 2 : 1;

    updateTurn();
}

function getCriticalMass(row,col){

    const isCorner =
        (row===0 && col===0) ||
        (row===0 && col===cols-1) ||
        (row===rows-1 && col===0) ||
        (row===rows-1 && col===cols-1);

    if(isCorner) return 2;

    const isEdge =
        row===0 ||
        row===rows-1 ||
        col===0 ||
        col===cols-1;

    if(isEdge) return 3;

    return 4;
}

function addOrb(row,col,player){

    board[row][col].count++;
    board[row][col].owner=player;

    if(
        board[row][col].count >=
        getCriticalMass(row,col)
    ){
        explode(row,col,player);
    }
}

function explode(row,col,player){

    board[row][col].count=0;
    board[row][col].owner=0;

    const dirs=[
        [-1,0],
        [1,0],
        [0,-1],
        [0,1]
    ];

    dirs.forEach(dir=>{

        const nr=row+dir[0];
        const nc=col+dir[1];

        if(
            nr>=0 &&
            nr<rows &&
            nc>=0 &&
            nc<cols
        ){
            addOrb(nr,nc,player);
        }
    });
}

function updateTurn(){

    if(currentPlayer===1){
        turnText.innerHTML="🔴 Player 1 Turn";
    }else{
        turnText.innerHTML="🟢 Player 2 Turn";
