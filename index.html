<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chain Reaction</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

h1{
    margin-top:20px;
}

#turn{
    margin:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(6,70px);
    gap:5px;
    justify-content:center;
}

.cell{
    width:70px;
    height:70px;
    border:2px solid #fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.red{
    border-color:#ff4d4d;
}

.green{
    border-color:#44ff44;
}

.orbs{
    position:relative;
    width:100%;
    height:100%;
}

.orb{
    width:14px;
    height:14px;
    border-radius:50%;
    position:absolute;
}

.redOrb{
    background:#ff4d4d;
}

.greenOrb{
    background:#44ff44;
}
    #restartBtn{
    padding:10px 18px;
    margin-bottom:20px;
    cursor:pointer;
    font-size:16px;
    border:none;
    border-radius:8px;
}
</style>
</head>

<body>

<h1>Chain Reaction</h1>
<h2 id="turn">🔴 Player 1 Turn</h2>
<button id="restartBtn">Restart Game</button>
<div class="grid" id="grid"></div>

<script>

const rows = 6;
const cols = 6;

let currentPlayer = 1;
    let totalMoves = 0;

const board = [];

const grid = document.getElementById("grid");
const turnText = document.getElementById("turn");

for(let r=0;r<rows;r++){

    board[r]=[];

    for(let c=0;c<cols;c++){

        board[r][c]={
            count:0,
            owner:0
        };

        const cell=document.createElement("div");

        cell.className="cell";
        cell.dataset.row=r;
        cell.dataset.col=c;

        cell.addEventListener("click",handleMove);

        grid.appendChild(cell);
    }
}

function handleMove(){

    const row=parseInt(this.dataset.row);
    const col=parseInt(this.dataset.col);

    const cellData=board[row][col];

    if(
        cellData.owner!==0 &&
        cellData.owner!==currentPlayer
    ){
        return;
    }

    addOrb(row,col,currentPlayer);
totalMoves++;
    render();
    checkWinner();

    currentPlayer =
        currentPlayer===1 ? 2 : 1;

    updateTurn();
    function checkWinner(){

    if(totalMoves < 4){
        return;
    }

    let red = 0;
    let green = 0;

    for(let r=0;r<rows;r++){

        for(let c=0;c<cols;c++){

            if(board[r][c].owner === 1){
                red++;
            }

            if(board[r][c].owner === 2){
                green++;
            }
        }
    }

    if(red === 0){
        setTimeout(()=>{
            alert("🟢 Player 2 Wins!");
        },100);
    }

    if(green === 0){
        setTimeout(()=>{
            alert("🔴 Player 1 Wins!");
        },100);
    }
}
}

function getCriticalMass(row,col){

    const isCorner =
        (row===0 && col===0) ||
        (row===0 && col===cols-1) ||
        (row===rows-1 && col===0) ||
        (row===rows-1 && col===cols-1);

    if(isCorner) return 2;

    const isEdge =
        row===0 ||
        row===rows-1 ||
        col===0 ||
        col===cols-1;

    if(isEdge) return 3;

    return 4;
}

function addOrb(row,col,player){

    board[row][col].count++;
    board[row][col].owner=player;

    if(
        board[row][col].count >=
        getCriticalMass(row,col)
    ){
        explode(row,col,player);
    }
}

function explode(row,col,player){

    board[row][col].count=0;
    board[row][col].owner=0;

    const dirs=[
        [-1,0],
        [1,0],
        [0,-1],
        [0,1]
    ];

    dirs.forEach(dir=>{

        const nr=row+dir[0];
        const nc=col+dir[1];

        if(
            nr>=0 &&
            nr<rows &&
            nc>=0 &&
            nc<cols
        ){
            addOrb(nr,nc,player);
        }
    });
}

function updateTurn(){

    if(currentPlayer===1){
        turnText.innerHTML="🔴 Player 1 Turn";
    }else{
        turnText.innerHTML="🟢 Player 2 Turn";
    }
}

function render(){

    const cells=document.querySelectorAll(".cell");

    cells.forEach(cell=>{

        const row=parseInt(cell.dataset.row);
        const col=parseInt(cell.dataset.col);

        const data=board[row][col];

        cell.innerHTML="";

        if(data.count>0){

    const color =
        data.owner===1
        ? 'redOrb'
        : 'greenOrb';

    let html='<div class="orbs">';

    if(data.count===1){

        html+=`
        <div class="orb ${color}"
        style="
        left:50%;
        top:50%;
        transform:translate(-50%,-50%);
        ">
        </div>`;

    }

    if(data.count===2){

        html+=`
        <div class="orb ${color}"
        style="left:25%;top:50%;">
        </div>

        <div class="orb ${color}"
        style="left:55%;top:50%;">
        </div>`;
    }

    if(data.count>=3){

        html+=`
        <div class="orb ${color}"
        style="left:20%;top:55%;">
        </div>

        <div class="orb ${color}"
        style="left:60%;top:55%;">
        </div>

        <div class="orb ${color}"
        style="left:40%;top:20%;">
        </div>`;
    }

    html+='</div>';

    cell.innerHTML=html;
}

        cell.classList.remove("red");
        cell.classList.remove("green");

        if(data.owner===1){
            cell.classList.add("red");
        }

        if(data.owner===2){
            cell.classList.add("green");
        }
    });
}

render();
document
.getElementById("restartBtn")
.addEventListener("click",()=>{

    location.reload();

});
</script>

</body>
</html>
